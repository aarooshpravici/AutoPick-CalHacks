[env:uno_r4_wifi]
platform = renesas-ra@1.9.0
board = uno_r4_wifi
framework = arduino
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
monitor_speed = 115200
build_unflags = -std=gnu++11
; GCC 14 diagnoses Arduino core 1.6.0 TinyUSB's TU_ASSERT in a void C
; function as an error; retain the diagnostic as a warning for that core.
build_flags = -std=gnu++17 -Wall -Wextra -Wno-error=return-mismatch
